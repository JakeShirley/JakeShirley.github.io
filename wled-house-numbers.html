		<h1>WLED House Numbers</h1>

		<p>Illuminated house numbers powered by <a href="https://kno.wled.ge/">WLED</a> and a Dig-Quad controller.</p>
		<p>Originally shared on <a href="https://www.reddit.com/r/WLED/comments/pzk585/led_house_numbers/">Reddit</a>.</p>

		<figure>
			<a href="media/wled-house-numbers/UtdN3SX.png"><img src="media/wled-house-numbers/UtdN3SX.png" alt="WLED house numbers project photo 1" width="1460" height="1946"></a>
			<figcaption>
				<p>This project was HEAVILY inspired by this post:<br><a href="https://web.archive.org/web/20210821031722/https://imgur.com/gallery/2Mm7ECo">https://imgur.com/gallery/2Mm7ECo</a></p>
				<p>The house numbers I bought can be found here: <a href="https://smile.amazon.com/gp/product/B099J14QKF/ref=ppx_yo_dt_b_search_asin_title?ie=UTF8&amp;psc=1">https://smile.amazon.com/gp/product/B099J14QKF/ref=ppx_yo_dt_b_search_asin_title?ie=UTF8&amp;psc=1</a></p>

		<figure>
			<video controls preload="metadata" playsinline width="960" height="1706">
				<source src="media/wled-house-numbers/f7RAS0m.mp4" type="video/mp4">
				<a href="media/wled-house-numbers/f7RAS0m.mp4">Open project video 3</a>

			<figcaption>First number I glued. It diffuses the light great!</figcaption>

		<figure>
			<video controls preload="metadata" playsinline width="960" height="540">
				<source src="media/wled-house-numbers/eTHulBl.mp4" type="video/mp4">
				<a href="media/wled-house-numbers/eTHulBl.mp4">Open project video 4</a>
			</video>
			<figcaption>Got the DIG-QUAD in the mail, testing a few together now.</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/p5hkBop.png"><img src="media/wled-house-numbers/p5hkBop.png" alt="WLED house numbers project photo 5" width="1460" height="1946" loading="lazy"></a>
			<figcaption>
				<p>Most of the numbers were a simple, single strand going one direction. I wanted them all to act as a virtual line, which WLED allows, but DIG-QUAD has four (QUAD) channels. I have five house numbers!</p>
				<p>"2" (being the fourth number) was the only one which I sent the control wire back to connect to the next wire. I could have done this whole thing this way and used a single segment controller but it was a huge pain in the ass so I am happy I only had to do this once.</p>
			</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/RPc1xmJ.png"><img src="media/wled-house-numbers/RPc1xmJ.png" alt="WLED house numbers project photo 6" width="1460" height="1946" loading="lazy"></a>
			<figcaption>"2" completed with control wire!</figcaption>
		</figure>
		<figure>
			<video controls preload="metadata" playsinline width="960" height="540">
				<source src="media/wled-house-numbers/if2XpfL.mp4" type="video/mp4">
				<a href="media/wled-house-numbers/if2XpfL.mp4">Open project video 5</a>
			</video>
			<figcaption>Let's try them all now! Getting ready to put them up.</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/b9mcDeS.png"><img src="media/wled-house-numbers/b9mcDeS.png" alt="WLED house numbers project photo 7" width="1460" height="1946" loading="lazy"></a>
			<figcaption>World's hackiest way to hang house numbers? Not really sure what I was doing.</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/K59ms7m.jpeg"><img src="media/wled-house-numbers/K59ms7m.jpeg" alt="WLED house numbers project photo 8" width="2595" height="1946" loading="lazy"></a>
			<figcaption>First number up. It started to get dark and to sprinkle so I did these in a speed-run fashion. They ended up <em>mostly</em> straight.</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/b9lyIgO.jpeg"><img src="media/wled-house-numbers/b9lyIgO.jpeg" alt="WLED house numbers project photo 9" width="2595" height="1946" loading="lazy"></a>
			<figcaption>Numbers up, but do they work?</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/rLOB3Nx.png"><img src="media/wled-house-numbers/rLOB3Nx.png" alt="WLED house numbers project photo 10" width="1460" height="1946" loading="lazy"></a>
			<figcaption>This is definitely NOT a hack! I "locked" the garage door during this so we didn't accidentally destroy the world.</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/Gwe47Yh.png"><img src="media/wled-house-numbers/Gwe47Yh.png" alt="WLED house numbers project photo 11" width="1460" height="1946" loading="lazy"></a>
			<figcaption>
				<p>IT LIVES!</p>
				<p>This took me like 10 tries of going into the attic and coming back down. At one point I thought I fried one of the numbers (SIGH) but a fuse on the DIG-QUAD saved me.</p>
			</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/xVNKU2H.jpeg"><img src="media/wled-house-numbers/xVNKU2H.jpeg" alt="WLED house numbers project photo 12" width="2595" height="1946" loading="lazy"></a>
			<figcaption>Now to heat shrink some longer wires! You can see the second to the left wire is all back because it's a 3-wire cable + an extra 20awg wire heatshrink'd. I didn't have my 4-wire cable at the time.</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/fwaQqpL.png"><img src="media/wled-house-numbers/fwaQqpL.png" alt="WLED house numbers project photo 13" width="1460" height="1946" loading="lazy"></a>
			<figcaption>Wires stapled into place with heat shrink going into the attic via a random flange I had. Definitely not "code".</figcaption>
		</figure>
		<figure>
			<a href="media/wled-house-numbers/eorpV10.png"><img src="media/wled-house-numbers/eorpV10.png" alt="WLED house numbers project photo 14" width="1460" height="1946" loading="lazy"></a>
			<figcaption>Maybe one day I'll add some J hooks to organize!</figcaption>
		</figure>
		<figure>

		</figure>
